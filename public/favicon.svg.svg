<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 101 107" width="101" height="107">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFF1A6"/>
      <stop offset="22%"  stop-color="#D4AF37"/>
      <stop offset="50%"  stop-color="#FFF3B0"/>
      <stop offset="75%"  stop-color="#C99A2E"/>
      <stop offset="100%" stop-color="#8A6518"/>
    </linearGradient>

    <mask id="lineMask" maskUnits="userSpaceOnUse"
          x="0" y="0" width="101" height="107">
      <image x="0" y="0" width="101" height="107"
             preserveAspectRatio="none"
             xlink:href="data:image/png;base64,"/>
    </mask>
  </defs>

  <!-- Transparent background; only the gold artwork is painted. -->
  <rect x="0" y="0" width="101" height="107"
        fill="url(#goldGradient)" mask="url(#lineMask)"/>
</svg>
